# The repository at http://repo.samcejko.eu/ (and, for old links, http://samcejko.eu/repo/).
# The generator writes into <site html root>/repo/ (on the Pi: /home/samuel/nginx/html/repo, which the nginx
# container sees under its own html root). Cydia on iOS 6 has to use plain http: its trust store lacks today's
# root CAs, so there is no https redirect anywhere here. Sileo, Zebra and Installer are fine with http as well.
#
# 1. At the http { } level (a file of its own in conf.d/ is enough): a Czech device gets the Czech pages.

map $http_accept_language $repo_lang {
    default "";
    "~*^cs" ".cs";
}

# 2. The repository's own server block. Replace ROOT with the container's path of the repo folder
#    (e.g. /usr/share/nginx/html/repo when the site's html folder is mounted at /usr/share/nginx/html).

server {
    listen 80;
    server_name repo.samcejko.eu;
    root ROOT;
    charset utf-8;
    autoindex off;
    index index$repo_lang.html index.html;

    # the index must never be stale: Cloudflare would cache .gz/.bz2 for hours by default
    location ~ ^/(Packages(\.gz|\.bz2)?|Release)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ ^/debs/.+\.deb$ {
        default_type application/octet-stream;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # native depictions for Sileo and Zebra: <package>.json, or <package>.cs.json for a Czech device
    location ~ ^/sileo/(?<pkg>[^/]+)\.json$ {
        default_type application/json;
        expires -1;
        try_files /sileo/$pkg$repo_lang.json /sileo/$pkg.json =404;
    }

    location = /sileo-featured.json {
        default_type application/json;
        expires -1;
    }

    # the feedback form (bug reports, ideas, app requests): the page is static, rebuilt with the repository so its
    # app list is complete; it posts to feedback/api/, which goes to feedback/feedback_server.py on the Pi (a small
    # Python service on port 8732, started by systemd as repo-feedback.service). FEEDBACK_UPSTREAM is the address
    # at which the nginx container reaches the Pi itself (tools/pi-update.sh fills in the gateway of its network).
    location /feedback/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /feedback/api/ {
        proxy_pass http://FEEDBACK_UPSTREAM:8732/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 256k;
        expires -1;
        add_header Cache-Control "no-store";
    }
}

# 3. Optional, inside the server { } of samcejko.eu: the old path keeps working.
#
#    location = /repo { return 301 http://repo.samcejko.eu/; }
#    location /repo/ { return 301 http://repo.samcejko.eu$request_uri; }
#
#    (APT in Cydia follows the redirect for the index; the depiction and icon links in the index already point
#    at repo.samcejko.eu, so nothing else depends on the old path.)
